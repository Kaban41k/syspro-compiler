name: tests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Add grammar versions you have implemented (e.g. [1, 2, 3, 4, 5])
        grammar: [1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test harness dependency
        run: pip install pytest

      - name: Build your compiler
        run: javac -d build/classes/java/main src/main/java/kbn/*.java

      - name: Run tests for grammar ${{ matrix.grammar }}
        run: python3 test/run_tests.py test --grammar ${{ matrix.grammar }} --no-build